name: macOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/meson.build'
      - 'meson_options.txt'
      - '.github/workflows/macos-build.yaml'
  pull_request:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/meson.build'
      - 'meson_options.txt'
      - '.github/workflows/macos-build.yaml'

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools and dependencies
        run: |
          brew update

          # These are required for build, but usually already installed 
          # and up-to-date on the macOS runner. 
          ## brew install pkg-config glib gettext

          brew install babl gegl cairo gexiv2 pango gdk-pixbuf

          # Homebrew has no formula for gimp, but has "casks"
          # We need the library gimp-3.0 to build resynthesizer against.
          # See https://formulae.brew.sh/cask/gimp
          # We don't want the gimp@dev cask which is the latest unreleased version of GIMP.
          brew install --cask gimp

          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Prepare pkg-config for Homebrew dependencies
        run: |
          # Ensure Homebrew-provided .pc files are visible to pkg-config.

          # Keep generic Homebrew pkg-config directories.
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Configure GIMP headers
        run: |
          # Homebrew GIMP cask provides runtime libraries in the app bundle,
          # but not the full development headers needed by Meson.
          # There is no Resources/include/ directory in the GIMP app bundle, and no .pc file
          # There might be a /Headers/ directory with some headers.
          echo "Contents of /Applications/GIMP.app/Contents/Resources:"
          ls -l /Applications/GIMP.app/Contents/Resources
          echo "Contents of /Applications/GIMP.app/Contents/Resources/lib:"
          ls -al /Applications/GIMP.app/Contents/Resources/lib

      - name: Download GIMP source
        run: |
          gimp_src_dir="$RUNNER_TEMP/gimp-source"
          git clone --depth 1 https://gitlab.gnome.org/GNOME/gimp.git "$gimp_src_dir"

          # !!! Note that the checked out GIMP source may not match the version of the GIMP
          # libraries provided by Homebrew, which could lead to build issues.

          # Meson expects a directory containing libgimp/ and libgimpbase/.
          if [[ ! -f "$gimp_src_dir/libgimp/gimp.h" ]]; then
            echo "Downloaded source does not contain libgimp/gimp.h at expected path"
            exit 1
          fi

          echo "GIMP_SOURCE_DIR=$gimp_src_dir" >> "$GITHUB_ENV"

      - name: Configure env vars for meson build
        run: |
          # enginePlugin/meson.build expects these options on macOS.

          # Resynthesizer meson.build looks here for libraries to link against.
          # The libraries bundled with the Homebrew GIMP cask.
          echo "MAC_GIMP_APP=/Applications/GIMP.app" >> "$GITHUB_ENV"

      - name: Show tool versions
        env:
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          clang --version
          meson --version
          ninja --version
          
      - name: Preflight pkg-config finds libraries
        env:
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          # Check that pkg-config can find the dependencies provided by Homebrew.

          pkg-config --modversion glib-2.0
          pkg-config --list-all | grep gexiv2
          pkg-config --modversion gexiv2-0.16
          pkg-config --modversion gegl-0.4
          

          # gimp-3.0 is a dependency of resynthesizer, and is provided by Homebrew
          # but Homebrew does not provide a .pc file for it, so pkg-config cannot find it
          #pkg-config --modversion gimp-3.0




      - name: Configure
        env:
          CC: clang
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          MAC_GIMP_APP: ${{ env.MAC_GIMP_APP }}
          GIMP_SOURCE_DIR: ${{ env.GIMP_SOURCE_DIR }}
        run: |
          meson setup builddir \
            -Dinstall-test=false \
            -Dinstall-translations=true \
            -Dmac-gimp-app="$MAC_GIMP_APP" \
            -Dgimp-source-dir="$GIMP_SOURCE_DIR"

      - name: Compile
        run: meson compile -C builddir -v

      - name: Stage install tree
        run: meson install -C builddir --destdir "$PWD/stage"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resynthesizer-macos
          path: |
            stage/
            builddir/meson-logs/meson-log.txt
          if-no-files-found: error
          retention-days: 14
