name: macOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/meson.build'
      - 'meson_options.txt'
      - '.github/workflows/macos-build.yaml'
  pull_request:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/meson.build'
      - 'meson_options.txt'
      - '.github/workflows/macos-build.yaml'

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools and dependencies
        run: |
          brew update
          brew install pkg-config glib gettext 
          brew install --cask gimp
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Prepare pkg-config for Homebrew dependencies
        run: |
          # Ensure Homebrew-provided .pc files are visible to pkg-config.
          ## echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$(brew --prefix gimp)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Validate gimp-3.0 pkg-config module
        env:
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          if ! pkg-config --exists gimp-3.0; then
            echo "Expected pkg-config module 'gimp-3.0' was not found."
            echo "Current PKG_CONFIG_PATH: $PKG_CONFIG_PATH"
            echo "Available gimp-related .pc files under Homebrew:"
            find "$(brew --prefix)" -path '*/pkgconfig/*.pc' -name '*gimp*.pc' -print | sort || true
            exit 1
          fi

      - name: Show tool versions
        env:
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          clang --version
          meson --version
          ninja --version
          pkg-config --modversion glib-2.0
          pkg-config --modversion gimp-3.0

      - name: Configure
        env:
          CC: clang
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: meson setup builddir -Dinstall-test=false -Dinstall-translations=true

      - name: Compile
        run: meson compile -C builddir -v

      - name: Stage install tree
        run: meson install -C builddir --destdir "$PWD/stage"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resynthesizer-macos
          path: |
            stage/
            builddir/meson-logs/meson-log.txt
          if-no-files-found: error
          retention-days: 14
